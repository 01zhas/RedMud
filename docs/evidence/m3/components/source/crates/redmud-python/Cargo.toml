[package]
name = "redmud-python"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "RedMud transform engine"
[lib]
name = "_native"
crate-type = ["cdylib"]
[dependencies]
redmud-core = { path = "../redmud-core" }
serde_json = "1"
pyo3 = { version = "0.29", features = ["extension-module"] }
