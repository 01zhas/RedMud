name: Verify RedMud
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ matrix.os }} / CPython ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.12', '3.13']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Record platform and require approved architecture
        run: |
          python -c "import platform,sys; print(platform.platform(),sys.version); assert platform.machine() == ('arm64' if platform.system() == 'Darwin' else 'x86_64')"
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.99.1
          rustc -Vv
      - name: Install pinned developer tools
        run: python -m pip install -r requirements-dev.txt
      - name: Rust, Python and static checks against installed wheel
        run: |
          mkdir -p target
          bash scripts/check.sh 2>&1 | tee target/ci-check.log
      - name: Independent wheel and sdist installs
        run: python scripts/package_check.py 2>&1 | tee target/ci-package.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-${{ runner.os }}-${{ matrix.python }}
          retention-days: 7
          path: |
            target/ci-*.log
            target/package-check/**/result.json
            target/package-check/**/*.whl
            target/package-check/**/*.tar.gz
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install approved scanners separately
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
          cargo fetch --locked
          cargo install cargo-audit --version 0.22.2 --locked --root target/audit-tools
          python -m venv target/audit-python
          target/audit-python/bin/python -m pip install -r requirements-security.txt
      - name: Check notices and dated advisories without ignores
        env:
          REDMUD_CARGO_AUDIT: ${{ github.workspace }}/target/audit-tools/bin/cargo-audit
          REDMUD_PIP_AUDIT_PYTHON: ${{ github.workspace }}/target/audit-python/bin/python
        run: |
          mkdir -p target
          bash scripts/security.sh 2>&1 | tee target/ci-security.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-evidence
          retention-days: 7
          path: |
            target/ci-security.log
            target/security/*.json
